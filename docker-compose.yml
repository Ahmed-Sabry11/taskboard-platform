name: taskboard

# Local development stack.
#
#   browser --> frontend --(edge)--> backend --(data)--> db
#
# Every published port is bound to 127.0.0.1, so nothing is reachable from
# other machines on the network. Settings come from .env (see .env.example).

x-hardening: &hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-backend: &backend
  <<: *hardening
  build:
    context: ./app/backend
    target: runtime
  image: taskboard-backend:local
  environment:
    APP_ENV: ${APP_ENV:-development}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  tmpfs:
    - /tmp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
    # Published for tools on your machine (psql, host-run tests). The other
    # containers reach the database over the "data" network, not this port.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # One-shot job, the same shape as the Kubernetes migration Job later on.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      disable: true

  backend:
    <<: *backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - edge
      - data
    # Readiness, stricter than the image's liveness check: the frontend
    # starts only once the backend can actually reach the database.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/readyz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    <<: *hardening
    build:
      context: ./app/frontend
      target: runtime
    image: taskboard-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
    # NGINX needs two writable places: /tmp for its pid and temp files, and
    # conf.d for the config rendered from the template. Both live in memory.
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755

  # ---- Test runners: started only with "--profile test" ----

  backend-tests:
    <<: *hardening
    profiles: ["test"]
    build:
      context: ./app/backend
      target: test
    image: taskboard-backend-tests:local
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/taskboard_test
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data
    tmpfs:
      - /tmp

  frontend-tests:
    profiles: ["test"]
    build:
      context: ./app/frontend
      target: test
    image: taskboard-frontend-tests:local
    # The frontend tests use an in-memory backend and need no network at all.
    network_mode: none

networks:
  # frontend <-> backend
  edge:
  # backend <-> db. The frontend is not attached, so it cannot reach the database.
  data:

volumes:
  # Holds the PostgreSQL data directory. Survives "docker compose down".
  db-data:
