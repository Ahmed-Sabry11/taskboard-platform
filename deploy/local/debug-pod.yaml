# Throwaway pod for network troubleshooting. A plain "kubectl run" is rejected
# by the namespace's restricted Pod Security level, so this one is compliant.
#
#   kubectl apply -f deploy/local/debug-pod.yaml
#   kubectl -n taskboard exec -it debug -- sh
#   kubectl -n taskboard delete pod debug
apiVersion: v1
kind: Pod
metadata:
  name: debug
  namespace: taskboard
  labels:
    app.kubernetes.io/name: debug
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
