# Local cluster (kind or minikube): the base application plus an in-cluster
# PostgreSQL, locally built images, and a NodePort for browser access.
#
# Deployed by ArgoCD (see docs/gitops-local.md), or by hand with:
#   kubectl apply -k deploy/apps/taskboard/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: taskboard

resources:
  - ../../base
  - postgres-service.yaml
  - postgres-statefulset.yaml

# Images built by "docker compose build" and loaded into the cluster.
images:
  - name: taskboard-backend
    newTag: local
  - name: taskboard-frontend
    newTag: local

configMapGenerator:
  - name: backend-config
    behavior: merge
    literals:
      - DB_HOST=postgres

# The taskboard-db-credentials Secret is deliberately not defined here.
# ArgoCD builds this overlay from Git, and credentials are never in Git.
# Create the Secret once, straight from the git-ignored secrets.env:
#
#   kubectl -n taskboard create secret generic taskboard-db-credentials \
#     --from-env-file=deploy/apps/taskboard/overlays/local/secrets.env
#
# On AWS the same Secret is provided by External Secrets from Secrets Manager.

patches:
  - path: frontend-service-nodeport.yaml

replicas:
  - name: frontend
    count: 3
