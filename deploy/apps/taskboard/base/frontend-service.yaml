apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  # ClusterIP here. Each overlay decides how traffic enters the cluster:
  # a NodePort locally, an ALB Ingress on AWS.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
