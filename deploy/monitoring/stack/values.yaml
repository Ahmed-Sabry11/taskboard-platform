# Values for the kube-prometheus-stack chart, shared by every cluster.
# The chart version is pinned in the ArgoCD Application of each cluster.

# ---- Control plane components that neither kind nor EKS exposes ---------------
# Scraping them would only produce targets that are permanently down and
# alerts that never clear.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false

# ---- Prometheus ---------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 3d

    # Pick up ServiceMonitors, PodMonitors, Probes and rules from every
    # namespace, not only the ones this chart creates. That is what lets the
    # application ship its own monitoring definitions.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

# ---- Alertmanager -------------------------------------------------------------
# Running, with no receiver configured: alerts are visible in its interface
# and in Grafana, and are sent nowhere.
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

# ---- Grafana ------------------------------------------------------------------
grafana:
  # The chart's built-in default password is public knowledge. The login is
  # read from a Secret created outside Git instead. See docs/observability.md.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password

  defaultDashboardsTimezone: browser

  sidecar:
    dashboards:
      # Load dashboards from ConfigMaps labelled grafana_dashboard in any namespace.
      searchNamespace: ALL

  # Grafana needs far more memory while starting than while idle. With a
  # 256Mi limit it never finished starting: it spent all its time reclaiming
  # memory until the liveness probe restarted it.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # First start runs database migrations and can take minutes on a laptop.
  livenessProbe:
    initialDelaySeconds: 240
