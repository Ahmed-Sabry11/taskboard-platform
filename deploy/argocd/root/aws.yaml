# The root application ("app of apps") for the EKS cluster. Applied once by
# hand after ArgoCD is installed. Everything else follows from Git.
#
#   kubectl apply -f deploy/argocd/root/aws.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ahmed-Sabry11/taskboard-platform.git
    targetRevision: main
    path: deploy/argocd/apps/aws
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
