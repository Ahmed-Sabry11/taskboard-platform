# The root application ("app of apps") for the local cluster. Applied once by
# hand. It makes ArgoCD watch deploy/argocd/apps/local, where every other
# Application is declared, so adding an application is a Git change.
#
#   kubectl apply -f deploy/argocd/root/local.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ahmed-Sabry11/taskboard-platform.git
    targetRevision: main
    path: deploy/argocd/apps/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
